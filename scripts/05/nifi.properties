# Minimal NiFi 2.x standalone configuration for the teaching example
# MySQL StudentsMySql -> Parquet -> HDFS -> Hive EXTERNAL Students
#
# IMPORTANT:
# Hadoop configuration is NOT configured globally in nifi.properties.
# In the PutHDFS processor set "Hadoop Configuration Resources" to:
# $HADOOP_CONF_DIR/core-site.xml,$HADOOP_CONF_DIR/hdfs-site.xml
# $HADOOP_HOME is assumed to be /usr/local/hadoop.

# -----------------------------------------------------------------------------
# Core directories
# -----------------------------------------------------------------------------
nifi.flow.configuration.file=./conf/flow.json.gz
nifi.flow.configuration.archive.enabled=true
nifi.flow.configuration.archive.dir=./conf/archive/
nifi.flow.configuration.archive.max.time=30 days
nifi.flow.configuration.archive.max.storage=500 MB

nifi.database.directory=./database_repository
nifi.flowfile.repository.directory=./flowfile_repository
nifi.content.repository.directory.default=./content_repository
nifi.provenance.repository.directory.default=./provenance_repository
nifi.provenance.repository.max.storage.time=24 hours

# Local state for QueryDatabaseTable maximum-value state etc.
nifi.state.management.configuration.file=./conf/state-management.xml
nifi.state.management.provider.local=local-provider

# -----------------------------------------------------------------------------
# Standalone instance
# -----------------------------------------------------------------------------
nifi.cluster.is.node=false
nifi.zookeeper.connect.string=

# -----------------------------------------------------------------------------
# Web UI
# NiFi 2 defaults to secure HTTPS. Keep the installation-generated HTTPS,
# identity, keystore and truststore settings unless intentionally changing them.
# Bind to all interfaces only for a lab VM protected by firewall/network rules.
# -----------------------------------------------------------------------------
nifi.web.https.host=0.0.0.0
nifi.web.https.port=8443
nifi.web.http.host=
nifi.web.http.port=

# -----------------------------------------------------------------------------
# Sensitive properties
# Keep/set a non-empty value. For a real installation use a long random secret
# and do not commit it to source control.
# generate using: openssl rand -hex 32
# -----------------------------------------------------------------------------
nifi.sensitive.props.key=325967d71cd78f5742e4b4c5563223390d9c50199df8079f67dc80a3779324ad

# -----------------------------------------------------------------------------
# HDFS application notes (configured in PutHDFS, not here)
# -----------------------------------------------------------------------------
# Hadoop Configuration Resources:
#   /usr/local/hadoop/etc/hadoop/core-site.xml,
#   /usr/local/hadoop/etc/hadoop/hdfs-site.xml
# HDFS target directory:
#   /user/hduser/hive_external/studentsNifi
#
# Parquet is configured with ParquetRecordSetWriter in the NiFi flow.
# No Parquet property is required in this file.
#
# MySQL is configured in a DBCPConnectionPool controller service, e.g.:
#   JDBC URL: jdbc:mysql://localhost:3306/university
#   Driver:   com.mysql.cj.jdbc.Driver
# The MySQL Connector/J JAR location is configured on that controller service.